### VAuLT VHosts ###
#
# Replace every "your-domain.example" placeholder below with your own
# domain(s) before deploying. These ServerName/ServerAlias values, and the
# SSL certificate paths in the commented-out example lines, are specific to
# your own hosting setup and must be filled in.

# <VirtualHost *:80>
# 	ServerName vault.your-domain.example
# 	ServerAlias quest-api.your-domain.example quest.your-domain.example vault-api.your-domain.example
# 	DocumentRoot "/path/to/vault_web/vault/frontend/web/"

# 	RewriteEngine On
# 	RewriteCond %{HTTPS} off
# 	RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI}
# </VirtualHost>

### This is the api endpoint URL ###
<VirtualHost *:80>
	ServerName vault-api.your-domain.example
	ServerAlias quest-api.your-domain.example
	DocumentRoot "/var/www/html/frontend/web/"

	<Directory "/var/www/html/frontend/web/">
		# use mod_rewrite for pretty URL support
		RewriteEngine on
		# If a directory or a file exists, use the request directly
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		# Otherwise forward the request to index.php
		RewriteRule . index.php

		# use index.php as index file
		DirectoryIndex index.php

		# ...other settings...
		Require all granted
	</Directory>

	Alias /common /var/www/html/common/web/
	<Directory "/var/www/html/common/web/">
		# Deny all files by default
		Require all denied

		# Allow only specific file types
		<FilesMatch "(?i)\.(jpg|jpeg|png|gif|mp3|mp4|mpeg4|mov|m4v|m4a|css|js|html|htm|xml|json|txt|ico|svg|woff|woff2|ttf|eot|webp|webm|avif)$">
			Require all granted
    	</FilesMatch>
	</Directory>

	# SSLEngine on
	# SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
	# SSLCipherSuite	 HIGH:+AES256:+SHA384:+SHA256:!SHA:!3DES:!aNULL:!PSK:!MD5:!KRB5:!DSS:!aDH:!CAMELLIA:!aECDH:!RSA:!DHE
	# SSLCertificateFile /etc/ssl/your-domain-cert.cer
	# SSLCertificateKeyFile /etc/ssl/your-domain.key
	# SSLCertificateChainFile /etc/ssl/your-domain-interm.cer
</VirtualHost>

### This is the backend editor ###
<VirtualHost *:89>
	ServerName vault.your-domain.example
	ServerAlias quest.your-domain.example
	DocumentRoot "/var/www/html/backend/web/"

	<Directory "/var/www/html/backend/web/">
			# use mod_rewrite for pretty URL support
			RewriteEngine on
			# If a directory or a file exists, use the request directly
			RewriteCond %{REQUEST_FILENAME} !-f
			RewriteCond %{REQUEST_FILENAME} !-d
			# Otherwise forward the request to index.php
			RewriteRule . index.php

			# use index.php as index file
			DirectoryIndex index.php

			# ...other settings...
			Require all granted
	</Directory>

	Alias /common /var/www/html/common/web/
	<Directory "/var/www/html/common/web/">
        # Deny all files by default
		Require all denied
		
		# Allow only specific file types
		<FilesMatch "(?i)\.(jpg|jpeg|png|gif|mp3|mp4|mpeg4|mov|m4v|m4a|css|js|html|htm|xml|json|txt|ico|svg|woff|woff2|ttf|eot|webp|webm|avif)$">
			Require all granted
    	</FilesMatch>
	</Directory>

	# SSLEngine on
	# SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
	# SSLCipherSuite	 HIGH:+AES256:+SHA384:+SHA256:!SHA:!3DES:!aNULL:!PSK:!MD5:!KRB5:!DSS:!aDH:!CAMELLIA:!aECDH:!RSA:!DHE
	# SSLCertificateFile /etc/ssl/your-domain-cert.cer
	# SSLCertificateKeyFile /etc/ssl/your-domain.key
	# SSLCertificateChainFile /etc/ssl/your-domain-interm.cer
</VirtualHost>

# Security
<Directory "/var/www/html">
	AllowOverride None
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<DirectoryMatch "/\.(git|svn|hg)/">
    Require all denied
</DirectoryMatch>

<FilesMatch "\.(htaccess|htpasswd|ini|log|sh|sql|conf)$">
    Require all denied
</FilesMatch>